name: Android

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the pinned SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test, lint and build both variants
        run: ./gradlew :motion:test :data:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Check packaged privacy boundary
        shell: bash
        run: bash .github/scripts/check-apks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            motion/build/reports/tests/
            data/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
